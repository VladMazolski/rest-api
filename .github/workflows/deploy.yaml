name: deploy

on:
  push:
    branches: ["main"]

# Variables globales
env:
  REGISTRY: vladmazolski
  IMAGE_NAME: rest_api

jobs:
  # Fallar a tiempo: primero las pruebas (baratas y rápidas),
  # y solo si pasan se construye y publica la imagen.
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test

      - name: Test succeeded?
        if: ${{ success() }}
        run: echo "Test Succeeded!!!"

      - name: Test failed?
        if: ${{ failure() }}
        run: echo "${{ env.IMAGE_NAME }} test failed"

  build:
    name: Build Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            APP_ENV=${{ secrets.APP_ENV }}
