apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: demo-frontend
  namespace: demo
spec:
  provider: nginx
  # deployment reference
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo-frontend
  # ingress reference
  ingressRef:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    name: demo-frontend-ingress
  # HPA reference (optional)
  autoscalerRef:
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    name: demo-frontend-hpa

  # the maximum time in seconds for the canary deployment
  # to make progress before it is rollback (default 600s)
  progressDeadlineSeconds: 60
  service:
    # ClusterIP port number
    port: 8080
    # container port number or name
    targetPort: 8080
  analysis:
    # schedule interval (default 60s)
    interval: 10s
    # max number of failed metric checks before rollback
    threshold: 10
    # max traffic percentage routed to canary
    maxWeight: 70
    # canary increment step
    stepWeight: 5
    # NGINX Prometheus checks
    metrics:
      - name: request-success-rate
        # minimum req success rate (non 5xx responses)
        thresholdRange:
          min: 99
        interval: 2m
    # tráfico sintético (el load tester vive dentro del cluster)
    webhooks:
      - name: "flagger load test"
        type: rollout
        url: http://flagger-loadtester.demo/
        timeout: 10s
        metadata:
          type: cmd
          # Local: el tráfico entra por el controller de NGINX (para generar métricas)
          # con la cabecera Host del dominio local, en lugar de resolver el DNS público.
          cmd: "hey -z 2m -q 10 -c 2 -host demo-frontend.127.0.0.1.nip.io http://ingress-nginx-controller.ingress-nginx/"
